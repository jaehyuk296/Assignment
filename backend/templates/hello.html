<!DOCTYPE html>
<html lang="ko">
<head>

    <title>Hello</title>

        body { font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif; background: #f7f8fa; }

<body>
    <div class="center">
        <h1>안녕하세요!</h1>
        <div class="name">{{ name }}님, 환영합니다 🎉</div>
        <a href="/">메인으로</a>
    </div>
</body>
</html>
