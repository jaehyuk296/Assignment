4단계: 상품 추가 폼 예시 페이지입니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 추가</title>
</head>
<body>
    <h1>상품 추가</h1>
    <form method="post" action="/products">
        <input type="text" name="name" placeholder="상품명" required>
        <input type="number" name="price" placeholder="가격" required>
        <button type="submit">추가</button>
    </form>
    <a href="/">메인으로</a>
</body>
</html>
