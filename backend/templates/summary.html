<!--
3단계: 사용자+상품 등 복합 데이터를 보여주는 예시 페이지입니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>요약 정보</title>
</head>
<body>
    <h1>요약 정보</h1>
    <h2>구매 내역</h2>
    <table border="1">
        <thead>
            <tr><th>구매자</th><th>상품명</th><th>가격</th><th>구매일시</th></tr>
        </thead>
        <tbody>
        {% for purchase in purchases %}
            <tr>
                <td>{{ purchase.user_name }}</td>
                <td>{{ purchase.product_name }}</td>
                <td>{{ purchase.product_price }}</td>
                <td>{{ purchase.date }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <!-- 사용자/상품 등 복합 데이터 출력 예시 -->
    <a href="/">메인으로</a>
</body>
</html>
